name: edumesh_android
description: "A self-hosted, offline educational ecosystem for Project Lumina."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  flutter_screenutil: ^5.9.0
  dio: ^5.4.0
  path_provider: ^2.1.2
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.5.5
  webview_flutter: ^4.4.2

  video_player: ^2.8.2

  pdfx: ^2.0.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.3.0

  flutter_secure_storage: ^10.2.0
  app_settings: ^7.0.0
  wakelock_plus: ^1.6.1


  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.3
  multicast_dns: ^0.3.2
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0





dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKannada-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700