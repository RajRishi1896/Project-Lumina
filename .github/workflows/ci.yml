name: CI

on: [push, pull_request]

jobs:
  lint-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Debian Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --select=F401,PLR0913,T201,TD001

  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_i18n.py

  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Debian Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduMesh-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
      - run: flutter pub get
      - run: dart analyze lib/
      - run: flutter test
