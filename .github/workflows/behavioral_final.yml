name: Behavioral Final Verification

on:
  push:
    branches: [fix/behavioral-final]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 scripts/behavioral_fix.py
      - name: Validate backend
        working-directory: Debian Server
        run: |
          python -m pip install -r requirements.txt
          python -m pytest
          python -m compileall -q app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
      - name: Validate Flutter
        working-directory: EduMesh-Android
        run: |
          flutter pub get
          dart analyze lib/ --no-fatal-warnings
          flutter test
      - name: Commit and clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/behavioral_fix.py .github/workflows/behavioral_final.yml
          git add .
          git diff --cached --check
          git commit -m "fix: harden app behavior and profile state"
          git push origin HEAD:fix/behavioral-final
