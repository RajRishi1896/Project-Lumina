    <!-- Section: Main Content ï¿½ password change, profile management -->

        <div id="app-content">
        <div class="page-header">
            <h1 data-i18n="security.account_settings">Account Settings</h1>
            <p data-i18n="security.page_description">Update your password, display name, and department.</p>
        </div>

        <!-- Section: Change Admin Password ï¿½ current password, new password, toggle visibility -->
        <div class="card">
            <div class="card-title" data-i18n="security_change_password_title">Change Admin Password</div>
            <div id="securityNotif" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-align: center; transition: all 0.3s ease;"></div>
            <div class="security-form">
                <div class="form-group">
                    <label for="oldPwd" data-i18n="security_current_password">Current Password</label>
                    <div class="password-container">
                        <input type="password" id="oldPwd" placeholder="Enter current password" data-i18n="security_current_password_placeholder">
                        <button type="button" class="toggle-password" id="toggleOldPwdBtn" data-password-input="oldPwd" data-eye-icon="eyeIconOld" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIconOld">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="newPwd" data-i18n="security_new_password">New Password</label>
                    <div class="password-container">
                        <input type="password" id="newPwd" placeholder="Enter new password" data-i18n="security_new_password_placeholder">
                        <button type="button" class="toggle-password" id="toggleNewPwdBtn" data-password-input="newPwd" data-eye-icon="eyeIconNew" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIconNew">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.375rem;" data-i18n="security_password_requirements">Must be 8+ chars, with uppercase, lowercase &amp; a digit.</div>
                    </div>
                </div>
                <button id="btn-changePassword" class="btn btn-primary" data-i18n="security_update_password">Update Password</button>
            </div>
        </div>

        <!-- Section: My Profile ï¿½ editable name and department -->

            <div class="card-title" data-i18n="security_my_profile">My Profile</div>
            <div id="profileNotif" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-align: center; transition: all 0.3s ease;"></div>

                <div class="form-group">
                    <label for="profileName" data-i18n="security_name">Name</label>
                    <input type="text" id="profileName" placeholder="Enter your display name" data-i18n="security_name_placeholder">
                </div>
                <div class="form-group">
                    <label for="profileDepartment" data-i18n="security_department">Department</label>
                    <input type="text" id="profileDepartment" placeholder="Enter your department" data-i18n="security_department_placeholder">

                <button id="btn-saveMyProfile" class="btn btn-primary" data-i18n="security_save">Save</button>

    <script src="/static/js/lumina.js" defer></script>
    <!-- Section: Inline Scripts ï¿½ password change, teacher CRUD, force reset, confirm modal -->
    <script>
        /**
         * Toggles password input visibility between text and password types.
         * Updates the eye icon SVG accordingly.
         * @param {string} inputId - The DOM id of the password input
         * @param {string} eyeIconId - The DOM id of the eye icon SVG
         * @param {string} btnId - The DOM id of the toggle button
         */
        function togglePasswordVisibility(inputId, eyeIconId, btnId) {
            const pwdInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(eyeIconId);
            const toggleBtn = document.getElementById(btnId);
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.setAttribute('aria-label', __('security.aria.hide_password'));
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                pwdInput.type = 'password';
                toggleBtn.setAttribute('aria-label', __('security.aria.show_password'));
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        /**
         * Changes the admin password. Validates complexity requirements, then
         * sends POST to /teacher/change-password with old and new passwords.
         * On success, redirects to home after a short delay.
         */
        async function changePassword() {
            const oldPwd = document.getElementById('oldPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            if (!oldPwd || !newPwd) return showNotification('securityNotif', __('security.error.both_fields'), true);
            if (newPwd.length < 8) return showNotification('securityNotif', __('security.error.password_length'), true);
            if (!/[A-Z]/.test(newPwd)) return showNotification('securityNotif', __('security.error.uppercase'), true);
            if (!/[a-z]/.test(newPwd)) return showNotification('securityNotif', __('security.error.lowercase'), true);
            if (!/\d/.test(newPwd)) return showNotification('securityNotif', __('security.error.digit'), true);
            try {
                const res = await fetch('/teacher/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
                });
                if (res.ok) {
                    showNotification('securityNotif', __('security.success.password_updated'), false);
                    setTimeout(() => location.href = '/', 1500);
                } else {
                    let msg = __('security.error.current_password');
                    try { const err = await res.json(); if (err.detail) msg = err.detail; } catch (_) {}
                    showNotification('securityNotif', msg, true);
                }
            } catch (e) {
                let msg = __('security.error.connection');
                try { const err = await e.json?.(); if (err?.detail) msg = err.detail; } catch (_) {}
                showNotification('securityNotif', msg, true);
            }
        }







        /** Loads the current user's profile (name, department) into the profile form. */
        async function loadMyProfile() {
            try {
                const res = await fetch('/teacher/me');
                if (res.ok) {
                    const me = await res.json();
                    document.getElementById('profileName').value = me.name || '';
                    document.getElementById('profileDepartment').value = me.department || '';
                    if (me.username === 'admin') {
                        document.getElementById('profileName').disabled = true;
                        document.getElementById('profileDepartment').disabled = true;
                        document.getElementById('profileName').style.opacity = '0.5';
                        document.getElementById('profileDepartment').style.opacity = '0.5';
                        document.getElementById('oldPwd').disabled = true;
                        document.getElementById('newPwd').disabled = true;
                        document.getElementById('oldPwd').style.opacity = '0.5';
                        document.getElementById('newPwd').style.opacity = '0.5';
                        document.getElementById('btn-changePassword').disabled = true;
                        document.getElementById('btn-saveMyProfile').disabled = true;
                        document.getElementById('btn-changePassword').style.opacity = '0.5';
                        document.getElementById('btn-saveMyProfile').style.opacity = '0.5';
                    }
                }
            } catch (e) {
                console.error("Error loading profile", e);
            }
        }

        /** Saves the user's name and department via POST /teacher/profile/name and /teacher/profile/department. */
        async function saveMyProfile() {
            const name = document.getElementById('profileName').value.trim();
            const department = document.getElementById('profileDepartment').value.trim();
            if (!name) {
                return showNotification('profileNotif', __('security.error.name_empty'), true);
            }
            if (!department) {
                return showNotification('profileNotif', __('security.error.dept_empty'), true);
            }
            try {
                const nameRes = await fetch('/teacher/profile/name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (!nameRes.ok) {
                    let msg = __('security.error.update_name');
                    try { const err = await nameRes.json(); if (err.detail) msg = err.detail; } catch (_) {}
                    return showNotification('profileNotif', msg, true);
                }
                const deptRes = await fetch('/teacher/profile/department', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ department })
                });
                if (deptRes.ok) {
                    showNotification('profileNotif', __('security.success.profile_updated'), false);
                } else {
                    let msg = __('security.error.update_dept');
                    try { const err = await deptRes.json(); if (err.detail) msg = err.detail; } catch (_) {}
                    showNotification('profileNotif', msg, true);
                }
            } catch (e) {
                showNotification('profileNotif', __('security.error.connection'), true);
            }
        }

        _pageInitRegistry['security'] = function() {
            loadWhoAmI();
            checkSelfResetRequired();
            loadMyProfile();

            // Event listeners for onclick->addEventListener migration
            document.getElementById('btn-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('overlay-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('btn-toggleTheme')?.addEventListener('click', toggleTheme);
            document.getElementById('toggleOldPwdBtn')?.addEventListener('click', function() {
                togglePasswordVisibility('oldPwd', 'eyeIconOld', 'toggleOldPwdBtn');
            });
            document.getElementById('toggleNewPwdBtn')?.addEventListener('click', function() {
                togglePasswordVisibility('newPwd', 'eyeIconNew', 'toggleNewPwdBtn');
            });
            document.getElementById('btn-changePassword')?.addEventListener('click', changePassword);
            document.getElementById('btn-saveMyProfile')?.addEventListener('click', saveMyProfile);
            document.getElementById('btn-submitForcePasswordReset')?.addEventListener('click', submitForcePasswordReset);
        };

        document.addEventListener('DOMContentLoaded', _pageInitRegistry['security']);
    </script>
