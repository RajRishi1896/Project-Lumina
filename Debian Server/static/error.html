<!DOCTYPE html>
<html lang="en">
<head>
<!-- Section: Head -- metadata, styles, and theme detection -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="error.page_title">Access Error - Lumina Hub</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/Favicon.svg">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
<link rel="stylesheet" href="/static/css/lumina.css">
    <script src="/static/js/lumina.js?v=9" defer></script>
<style>
  .error-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem; width:100%; box-sizing:border-box; }
  .error-card { background:var(--bg-surface); border-radius:1rem; padding:3rem; max-width:480px; width:100%; text-align:center; box-shadow:var(--card-shadow); }
  @media (max-width: 480px) { .error-wrap { padding:1rem; } .error-card { padding:1.5rem; } }
  .error-icon { width:72px; height:72px; margin:0 auto 1.5rem; background:color-mix(in srgb, var(--teal) 12%, transparent); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .error-icon svg { width:36px; height:36px; stroke:var(--teal); fill:var(--teal); fill-opacity:0.15; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .error-card h1 { margin:0 0 .5rem; color:var(--text-primary); font-size:1.5rem; }
  .error-card p { margin:0 0 1.5rem; color:var(--text-secondary); line-height:1.6; }
  .error-card .actions { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
  .error-card .btn { display:inline-flex; align-items:center; gap:.5rem; padding:.75rem 1.5rem; background:var(--teal); color:var(--on-primary); border:none; border-radius:.5rem; font-size:.9rem; font-weight:700; cursor:pointer; text-decoration:none; }
  .error-card .btn:hover { opacity:.85; }
  .error-card .btn-outline { background:transparent; color:var(--text-primary); border:1px solid var(--outline); }
  .error-card .btn-outline:hover { background:var(--outline); }
  .error-card .btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .reason-badge { display:inline-block; padding:.25rem .75rem; border-radius:1rem; font-size:.75rem; font-weight:700; margin-bottom:1rem; }
  .reason-badge.expired { background:color-mix(in srgb, var(--saffron) 15%, transparent); color:var(--saffron); }
  .reason-badge.denied { background:color-mix(in srgb, var(--danger) 15%, transparent); color:var(--danger); }
  .reason-badge.notfound { background:color-mix(in srgb, var(--text-muted) 15%, transparent); color:var(--text-muted); }
</style>
</head>
<body>
    <a href="#errorCard" class="skip-link" data-i18n="skip_to_content">Skip to main content</a>
    <!-- Section: Error Card -- icon, reason badge, title, message, and back button -->
<div class="error-wrap">
<div class="error-card" id="errorCard">
  <!-- icon -->
  <div class="error-icon">
    <svg viewBox="0 0 24 24" id="errorIcon">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>
  <!-- Section: Reason Badge -- shows expired/denied/notfound -->
  <div class="reason-badge {{BADGE}}" id="reasonBadge" data-i18n="error_access_denied_badge">{{BADGE_TEXT}}</div>
  <!-- Section: Title -- page heading text -->
  <h1 id="errorTitle" data-i18n="error_access_denied_title">{{TITLE}}</h1>
  <!-- Section: Message -- error description text -->
  <p id="errorMessage" data-i18n="error_access_denied_message">{{MESSAGE}}</p>
  <!-- Section: Back Button -- navigates to welcome page -->
  <div class="actions">
    <a href="/welcome" class="btn" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span data-i18n="error_back_home">Back to Home</span>
    </a>
  </div>
</div>
</div>
<script>
// Restore saved theme (no toggle button -- error page is minimal)
(function applyTheme() {
    const stored = localStorage.getItem('lumina-theme');
    const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
})();

/*
 * Parse the ?reason= query param and render the matching error card content.
 * Supports: session_expired, access_denied, not_found.
 *
 * Key names are stored statically; translations are applied on load
 * via data-i18n / data-i18n-body attributes processed by applyLanguage().
 */
document.addEventListener('DOMContentLoaded', function() {
  const reason = new URLSearchParams(window.location.search).get('reason') || 'not_found';
  (function(){
    const titleEl = document.getElementById('errorTitle');
    const msgEl = document.getElementById('errorMessage');
    const badgeEl = document.getElementById('reasonBadge');
    const btnEl = document.getElementById('backBtn');

    const messages = {
      session_expired: {
        titleKey: 'error_session_expired_title',
        msgKey: 'error_session_expired_message',
        badgeKey: 'error_session_expired_badge',
        badgeClass: 'expired',
        home: '/welcome'
      },
      access_denied: {
        titleKey: 'error_access_denied_title',
        msgKey: 'error_access_denied_message',
        badgeKey: 'error_access_denied_badge',
        badgeClass: 'denied',
        home: '/welcome'
      },
      not_found: {
        titleKey: 'error_not_found_title',
        msgKey: 'error_not_found_message',
        badgeKey: 'error_not_found_badge',
        badgeClass: 'notfound',
        home: '/welcome'
      }
    };

    loadTranslations(currentLang).then(function() {
      const info = messages[reason] || messages.access_denied;
      titleEl.textContent = __(info.titleKey);
      msgEl.textContent = __(info.msgKey);
      badgeEl.textContent = __(info.badgeKey);
      badgeEl.className = 'reason-badge ' + info.badgeClass;
      btnEl.href = info.home;
    });
  })();
});
</script>
</body>
</html>
