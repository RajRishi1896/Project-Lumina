<!DOCTYPE html>

<head>
    <!-- Section: Head � metadata, theme detection, and help-specific styles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="help.page_title">Lumina Hub | Help & Documentation</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/Favicon.svg">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
<link rel="stylesheet" href="/static/css/lumina.css">

<style>
.help-section { max-width: 100%; width: 100%; }
.help-section .card { width: 100%; max-width: 100%; padding: 1.5rem; border-left: 4px solid var(--border); transition: border-color 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
.help-section .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent, var(--primary)); opacity: 0; transition: opacity 0.3s; }
.help-section .card:hover::before { opacity: 1; }
.help-section .card::after { content: ''; position: absolute; bottom: 0; right: 0; width: 100px; height: 100px; border-radius: 100px 0 0 0; background: var(--accent, var(--primary)); opacity: 0.03; transition: opacity 0.3s; }
.help-section .card:hover::after { opacity: 0.08; }
.help-section .card:hover { border-left-color: var(--accent, var(--primary)); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.help-section .section-title { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.85rem; display: flex; align-items: center; gap: 0.6rem; }
.help-section .section-title .icon-circle { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; transition: transform 0.2s; }
.help-section .section-title .icon-circle svg { width: 18px; height: 18px; }
.help-section .card:hover .icon-circle { transform: scale(1.1); }
.help-section ul, .help-section ol { padding-left: 1.5rem; line-height: 1.8; }
.help-section li { margin-bottom: 0.5rem; }
.help-section li::marker { color: var(--primary); }
.help-section code { word-break: break-all; font-size: 0.85rem; background: var(--bg-elevated); padding: 0.15rem 0.4rem; border-radius: 4px; }
@media (max-width: 768px) {
    .help-section .card { padding: 1rem; }
    .help-section ul, .help-section ol { padding-left: 1rem; }
    .help-section li { font-size: 0.85rem; }
}
</style>
</head>
