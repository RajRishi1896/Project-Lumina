<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Section: Head: metadata, theme detection, and help-specific styles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="help.page_title">Lumina Hub | Help & Documentation</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/Favicon.svg">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
<link rel="stylesheet" href="/static/css/lumina.css?v=24">

<style>
.help-section { max-width: 100%; width: 100%; }
.help-section .card { width: 100%; max-width: 100%; padding: 1.5rem; border-left: 4px solid var(--outline); }
.help-section .card:hover { border-left-color: var(--accent, var(--primary)); }
.help-section .section-title { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.85rem; display: flex; align-items: center; gap: 0.6rem; }
.help-section ul, .help-section ol { padding-left: 1.5rem; line-height: 1.8; }
.help-section li { margin-bottom: 0.5rem; }
.help-section li::marker { color: var(--primary); }
.help-section code { word-break: break-all; font-size: 0.85rem; background: var(--outline); padding: 0.15rem 0.4rem; border-radius: 4px; }
@media (max-width: 768px) {
    .help-section .card { padding: 1rem; }
    .help-section ul, .help-section ol { padding-left: 1rem; }
    .help-section li { font-size: 0.85rem; }
}
</style>
</head>
<body>
    <a href="#app-content" class="skip-link" data-i18n="skip_to_content">Skip to main content</a>
    
    <!-- Section: Sidebar: empty, rendered by renderLayout() -->
    <aside></aside>

    <!-- Section: Main Content: hardcoded documentation cards -->
    <main>
        <div id="app-content">
        <div class="page-header">
            <h1 data-i18n="help.title">Help &amp; Instructions</h1>
            <p data-i18n="help.subtitle">How to use the Lumina Hub and EduMesh app.</p>
        </div>

        <!-- Section: Getting Started: student onboarding steps -->
        <div class="card help-section">
            <div class="section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><polygon points="5 3 19 12 5 21 5 3"/></svg> <span data-i18n="help.getting_started">Getting Started</span></div>
            <div id="help-getting-started-body" data-i18n-body="help.getting_started_body"></div>
        </div>

        <!-- Section: Teacher Guide: uploading, managing, analytics, passwords -->
        <div class="card help-section" id="teacher-guide">
            <div class="section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#6366f1"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> <span data-i18n="help.teachers">For Teachers</span></div>
            <div id="help-teachers-body" data-i18n-body="help.teachers_body"></div>
        </div>

        <!-- Section: Student Tracking: study time, streak, privacy -->
        <div class="card help-section">
            <div class="section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#f59e0b"><path d="M12 20v-6M6 20V10M18 20V4"/></svg> <span data-i18n="help.tracking">Student Tracking</span></div>
            <div id="help-tracking-body" data-i18n-body="help.tracking_body"></div>
        </div>

        <!-- Section: Troubleshooting: connectivity, passwords, performance -->
        <div class="card help-section">
            <div class="section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#ef4444"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg> <span data-i18n="help.troubleshooting">Troubleshooting</span></div>
            <div id="help-troubleshooting-body" data-i18n-body="help.troubleshooting_body"></div>
        </div>

        <!-- Section: Admin Tasks: danger zone, settings, setup script -->
        <div class="card help-section">
            <div class="section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#14b8a6"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> <span data-i18n="help.admin">Admin Tasks</span></div>
            <div id="help-admin-body" data-i18n-body="help.admin_body"></div>
        </div>
        </div>
    </main>

    <!-- Section: Bottom Navigation (Mobile): icon + label tabs -->
    <div id="bottomNav"></div>

    <!-- Section: Scripts: lumina.js shared + init -->
    <script src="/static/js/lumina.js?v=15"></script>
    <script>
        /**
         * Page init (registered in _pageInitRegistry). No-op: the theme
         * toggle and mobile menu are wired once in lumina.js (renderModals).
         */
        const _initHelp = function() {};
        (window._pageInitRegistry = window._pageInitRegistry || {}).help = _initHelp;
    </script>

</body>
</html>
