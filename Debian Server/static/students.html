<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Hub | Students</title>
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
<link rel="stylesheet" href="/static/css/lumina.css">
    <style>
        .filter-row { display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-row .form-group { margin-bottom: 0; }
        .grade-filter { min-width: 180px; }
        .search-wrap { position: relative; flex: 1; min-width: 220px; }
        .search-inner { position: relative; }
        .search-inner input { width: 100%; padding: 0.5rem 0.75rem 0.5rem 2rem; font-size: 0.85rem; }
        .search-inner svg { position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .student-card { cursor: pointer; padding: 1.5rem; }
        .student-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0; }
        .student-row { display: flex; align-items: center; gap: 0.625rem; }
        .student-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .student-name-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
        .student-name { font-weight: 700; font-size: 0.9rem; color: var(--teal); text-decoration: none; }
        .student-meta { font-size: 0.75rem; color: var(--text-muted); }
        .scholar-id { font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.7rem; color: var(--text-muted); background: var(--outline); padding: 0.1rem 0.4rem; border-radius: 4px; }
        .student-stats { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
        .stat-pill { display: flex; align-items: center; gap: 0.25rem; white-space: nowrap; }
        .stat-pill-value { font-size: 0.9rem; font-weight: 800; color: var(--primary); letter-spacing: -0.01em; }
        @media (max-width: 768px) {
            .filter-row .form-group { width: 100%; }
            .grade-filter { min-width: 100%; }
            .search-wrap { min-width: 100%; }
            .student-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

        <div class="mobile-brand">Lumina Hub</div>
        <button class="menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle Menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </header>

    <div class="mobile-overlay" onclick="toggleMobileMenu()"></div>

    <aside>

        <div id="userInfo" class="sidebar-subtitle" style="margin-top:0.5rem; font-size:0.85rem; color: var(--on-primary);"></div>
        <div class="sidebar-divider"></div>
        <nav>
            <a href="/static/index" class="nav-item" id="nav-home">

                Settings
            </a>
        </nav>
        <div class="nav-spacer"></div>
        <div class="theme-toggle" onclick="toggleTheme()">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span id="themeLabel">Dark Mode</span>
        </div>
        <a href="/logout" class="nav-logout">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            Log out
        </a>
    </aside>

    <main>
        <div class="page-header">
            <h1>Student Monitoring</h1>
            <p>View and monitor student activity, study time, and engagement across grades.</p>
        </div>

        <div class="filter-row">
            <div class="form-group grade-filter">
                <label for="gradeFilter">Grade</label>
                <select id="gradeFilter" onchange="applyFilters()">
                    <option value="">All Grades</option>
                </select>
            </div>
            <div class="form-group search-wrap">
                <label for="searchInput">Search</label>
                <div class="search-inner">
                    <input type="text" id="searchInput" placeholder="Search by name or ID..." oninput="applyFilters()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
            </div>
            <button onclick="loadStudents()" class="btn btn-outline" style="padding:0.5rem 0.75rem; font-size:0.8rem; display:flex; align-items:center; gap:0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                Refresh
            </button>
        </div>

        <div id="studentContainer">
            <div class="empty-state">Loading students...</div>
        </div>
    </main>

        <div class="bottom-nav-item" id="bottom-nav-home">
            <a href="/static/index">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home

        </div>
        <div class="bottom-nav-item" id="bottom-nav-content">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px;"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>

        <div class="bottom-nav-item" id="bottom-nav-security">

        <div class="bottom-nav-item active" id="bottom-nav-students">
            <a href="/static/students">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Students
            </a>
        </div>
        <div class="bottom-nav-item" id="bottom-nav-help">
            <a href="/static/manage-help#teacher-guide">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px;"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
                Guide
            </a>

        <div class="bottom-nav-item" id="bottom-nav-danger">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>

    <div id="globalToastContainer" style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 99999; display: flex; flex-direction: column; gap: 0.75rem; max-width: 380px; width: 100%; pointer-events: none;"></div>

    <script src="/static/js/lumina.js"></script>
    <script>
        var allStudents = [];
        var allGrades = [];

        var demoStudents = [
            { id: 'demo-1', name: 'Ananya Sharma', grade: 'Grade 10', avatar: 'AS', last_active: new Date(Date.now()-1800000).toISOString(), week_minutes: 320, streak: 12, downloads: 18 },
            { id: 'demo-2', name: 'Rohit Kumar', grade: 'Grade 9', avatar: 'RK', last_active: new Date(Date.now()-7200000).toISOString(), week_minutes: 195, streak: 3, downloads: 7 },
            { id: 'demo-3', name: 'Priya Patel', grade: 'Grade 10', avatar: 'PP', last_active: new Date(Date.now()-300000).toISOString(), week_minutes: 425, streak: 18, downloads: 24 },
            { id: 'demo-4', name: 'Arjun Singh', grade: 'Grade 8', avatar: 'AS', last_active: new Date(Date.now()-3600000).toISOString(), week_minutes: 160, streak: 5, downloads: 4 },
            { id: 'demo-5', name: 'Meera Reddy', grade: 'Grade 9', avatar: 'MR', last_active: new Date(Date.now()-600000).toISOString(), week_minutes: 300, streak: 10, downloads: 15 },
            { id: 'demo-6', name: 'Vikram Joshi', grade: 'Grade 11', avatar: 'VJ', last_active: new Date(Date.now()-10800000).toISOString(), week_minutes: 228, streak: 7, downloads: 9 },
            { id: 'demo-7', name: 'Kavita Nair', grade: 'Grade 10', avatar: 'KN', last_active: new Date(Date.now()-900000).toISOString(), week_minutes: 330, streak: 14, downloads: 20 },
            { id: 'demo-8', name: 'Rahul Verma', grade: 'Grade 7', avatar: 'RV', last_active: new Date(Date.now()-86400000).toISOString(), week_minutes: 90, streak: 1, downloads: 2 },
            { id: 'demo-9', name: 'Sneha Gupta', grade: 'Grade 9', avatar: 'SG', last_active: new Date(Date.now()-2700000).toISOString(), week_minutes: 517, streak: 25, downloads: 32 },
            { id: 'demo-10', name: 'Amit Tiwari', grade: 'Grade 11', avatar: 'AT', last_active: new Date(Date.now()-7200000).toISOString(), week_minutes: 205, streak: 4, downloads: 6 }
        ];

        function timeAgo(iso) {
            if (!iso) return 'Never';
            var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 172800) return 'Yesterday';
            if (diff < 2592000) return Math.floor(diff / 86400) + 'd ago';
            return new Date(iso).toLocaleDateString();
        }

        function applyFilters() {
            var grade = document.getElementById('gradeFilter').value;
            var query = document.getElementById('searchInput').value.toLowerCase().trim();
            var filtered = allStudents;
            if (grade) filtered = filtered.filter(function(s) { return s.grade === grade; });
            if (query) filtered = filtered.filter(function(s) {
                return s.name.toLowerCase().includes(query) || s.id.toLowerCase().includes(query);
            });
            renderStudents(filtered);
        }

        function loadStudents() {
            var container = document.getElementById('studentContainer');
            var gradeFilter = document.getElementById('gradeFilter');

            if (IS_DEMO) {
                allStudents = demoStudents.slice();
                allGrades = [];
                demoStudents.forEach(function(s) {
                    if (allGrades.indexOf(s.grade) === -1) allGrades.push(s.grade);
                });
                allGrades.sort();
                gradeFilter.innerHTML = '<option value="">All Grades</option>' + allGrades.map(function(g) { return '<option value="' + esc(g) + '">' + esc(g) + '</option>'; }).join('');
                renderStudents(allStudents);
                return;
            }

            container.innerHTML = '<div class="empty-state"><span style="display:inline-block; animation: spin 1s linear infinite;">&#9696;</span> Loading students...</div>';
            var grade = gradeFilter ? gradeFilter.value : '';
            var url = '/teacher/students' + (grade ? '?grade=' + encodeURIComponent(grade) : '');

            fetch(url).then(function(res) {
                if (!res.ok) { container.innerHTML = '<div class="empty-state" style="color: var(--danger);">Failed to load students.</div>'; return null; }
                return res.json();
            }).then(function(data) {
                if (!data) return;
                var students = data.students || [];
                allStudents = students.map(function(s) {
                    var nameParts = (s.name || '?').split(' ');
                    var initials = nameParts.map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
                    return {
                        id: s.id || s.scholar_id || '',
                        name: s.name || 'Unknown',
                        grade: s.grade || '',
                        avatar: initials,
                        last_active: s.last_active || '',
                        week_minutes: (s.study_minutes_this_week || 0) * 60,
                        streak: s.streak_days || 0,
                        downloads: s.resources_saved || 0
                    };
                });
                allGrades = [];
                allStudents.forEach(function(s) {
                    if (s.grade && allGrades.indexOf(s.grade) === -1) allGrades.push(s.grade);
                });
                allGrades.sort();
                gradeFilter.innerHTML = '<option value="">All Grades</option>' + allGrades.map(function(g) { return '<option value="' + esc(g) + '">' + esc(g) + '</option>'; }).join('');
                renderStudents(allStudents);
            }).catch(function() {
                container.innerHTML = '<div class="empty-state" style="color: var(--danger);">Connection error. Check that the hub server is running.</div>';
            });
        }

        function renderStudents(list) {
            var container = document.getElementById('studentContainer');
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">No students found matching the current filter.</div>';
                return;
            }
            container.innerHTML = list.map(function(s) {
                var detailUrl = '/static/student-detail?id=' + encodeURIComponent(s.id) + '&name=' + encodeURIComponent(s.name) + '&grade=' + encodeURIComponent(s.grade) + '&avatar=' + encodeURIComponent(s.avatar) + '&last=' + encodeURIComponent(s.last_active || '');
                var wh = ((s.week_minutes || 0) / 60).toFixed(1).replace(/\.0$/, '');
                var st = s.streak || 0;
                var dl = s.downloads || 0;
                return '<div class="card student-card" onclick="window.location.href=\'' + detailUrl + '\'">' +
                    '<div class="student-row">' +
                    '<div class="student-avatar">' + esc(s.avatar) + '</div>' +
                    '<div class="student-body">' +
                    '<a href="' + detailUrl + '" class="student-name">' + esc(s.name) + '</a>' +
                    '<div class="student-meta">' +
                    esc(s.grade) + ' &middot; <span class="scholar-id">' + esc(s.id) + '</span> &middot; Last updated ' + timeAgo(s.last_active) +
                    '</div>' +
                    '</div>' +
                    '<div class="student-stats">' +
                    '<span class="stat-pill"><span class="stat-pill-value">' + wh + '<span style="font-weight:400;font-size:0.65rem;color:var(--text-muted);margin-left:0.1rem;">h</span></span></span>' +
                    '<span class="stat-pill"><span class="stat-pill-value">' + st + '<span style="font-weight:400;font-size:0.65rem;color:var(--text-muted);margin-left:0.1rem;">d</span></span></span>' +
                    '<span class="stat-pill"><span class="stat-pill-value">' + dl + '</span></span>' +
                    '</div>' +
                    '</div></div>';
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadStudents();
            loadWhoAmI();

        });
    </script>
</body>
</html>
