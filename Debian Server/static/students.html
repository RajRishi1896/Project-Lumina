<!DOCTYPE html>
<html lang="en">
<!-- Section: Head ï¿½ theme detection, metadata, styles -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="students.page_title">Students - Lumina Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/Favicon.svg">
    <!-- Theme detection: prevent flash of wrong theme by applying stored/device preference before render -->
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
<link rel="stylesheet" href="/static/css/lumina.css">
</head>
<body>
    <a href="#app-content" class="skip-link" data-i18n="skip_to_content">Skip to main content</a>
    <!-- Section: Sidebar -- empty, rendered by renderLayout() -->
    <aside></aside>

    <!-- Section: Main Content ï¿½ page header, filter row, student card list -->
    <main>
        <div id="app-content">
        <div class="page-header" style="margin-bottom: 2.5rem;">
            <h1 data-i18n="students.title">Students</h1>
            <p data-i18n="students.subtitle">View and manage registered students.</p>
        </div>

        <div class="filter-row">
            <div class="form-group grade-filter">
                <label for="gradeFilter" class="sr-only" data-i18n="students.filter_grade">Grade</label>
                <select id="gradeFilter" class="form-select">
                    <option value="" data-i18n="students.all_grades">All Grades</option>
                </select>
            </div>
            <div class="form-group search-wrap">
                <div class="search-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" class="form-input" placeholder="Search by name or ID..." data-i18n="students.search">
                </div>
            </div>
            <div class="filter-panel">
                <button id="btn-toggleFilters" class="btn btn-outline filter-panel-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                    <span data-i18n="students.filters">Filters</span>
                </button>
                <div id="filterPanelBody" class="filter-panel-body">
                    <div class="filter-panel-row">
                        <label for="sortSelect" data-i18n="students.sort_label">Sort by</label>
                        <select id="sortSelect" class="form-select">
                            <option value="name_asc" data-i18n="students.sort_name_asc">Name (A-Z)</option>
                            <option value="name_desc" data-i18n="students.sort_name_desc">Name (Z-A)</option>
                            <option value="grade_asc" data-i18n="students.sort_grade">Grade</option>
                            <option value="recent" data-i18n="students.sort_recent">Last Active (Recent)</option>
                            <option value="oldest" data-i18n="students.sort_oldest">Last Active (Oldest)</option>
                            <option value="study_high" data-i18n="students.sort_study_high">Study Time (High)</option>
                            <option value="study_low" data-i18n="students.sort_study_low">Study Time (Low)</option>
                            <option value="at_risk" data-i18n="students.sort_at_risk">At-risk (Inactive first)</option>
                        </select>
                    </div>
                    <div class="filter-panel-row" id="atRiskDaysRow">
                        <label for="atRiskDays" data-i18n="students.inactive_label">Inactive ></label>
                        <input type="number" id="atRiskDays" value="3" min="1" max="365" class="form-input" style="width: 80px;">
                        <span class="text-sm text-muted" data-i18n="students.days">days</span>
                    </div>
                </div>
            </div>
            <button id="btn-loadStudents" class="btn btn-outline btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                <span class="refresh-label" data-i18n="students_refresh">Refresh</span>
            </button>
        </div>

        <div id="studentContainer">
            <div class="empty-state" data-i18n="students_loading">Loading students...</div>
        </div>
        </div>
    </main>

    <!-- Section: Bottom Nav ï¿½ mobile tab bar (hidden by default, shown via media query) -->
    <div id="bottomNav"></div>

    <!-- Section: Toast Container ï¿½ global notification area (top-right, fixed) -->
    <div id="globalToastContainer" class="toast-container"></div>

    <script src="/static/js/lumina.js?v=5" defer></script>
    <!-- Section: Inline Scripts ï¿½ student list logic, filtering, rendering -->
    <script>
        var allStudents = [];
        var allGrades = [];



        /**
         * @param {string|null} iso - ISO date string or null
         * @returns {string} Human-friendly relative time label
         */
        function timeAgo(iso) {
            if (!iso) return __('students.never');
            const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
            if (diff < 60) return __('students.just_now');
            if (diff < 3600) return __('students.minutes_ago', {n: Math.floor(diff / 60)});
            if (diff < 86400) return __('students.hours_ago', {n: Math.floor(diff / 3600)});
            if (diff < 172800) return __('students.yesterday');
            if (diff < 2592000) return __('students.days_ago', {n: Math.floor(diff / 86400)});
            return new Date(iso).toLocaleDateString();
        }

        /** Filters the global allStudents array by grade, name/ID search, then re-renders. */
        function applyFilters() {
            const grade = document.getElementById('gradeFilter').value;
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const now = Date.now();
            let filtered = allStudents;
            if (grade) filtered = filtered.filter(function(s) { return s.grade === grade; });
            if (query) filtered = filtered.filter(function(s) {
                return s.name.toLowerCase().includes(query) || s.id.toLowerCase().includes(query);
            });
    var sortBy = document.getElementById('sortSelect').value;
    if (sortBy === 'at_risk') {
        var atRiskDays = parseInt(document.getElementById('atRiskDays').value, 10) || 3;
        filtered.sort(function(a, b) {
            var aDays = a.last_active ? (now - new Date(a.last_active).getTime()) / 86400000 : Infinity;
            var bDays = b.last_active ? (now - new Date(b.last_active).getTime()) / 86400000 : Infinity;
            return bDays - aDays;
        });
    } else {
    filtered.sort(function(a, b) {
        switch (sortBy) {
            case 'name_asc': return a.name.localeCompare(b.name);
            case 'name_desc': return b.name.localeCompare(a.name);
            case 'grade_asc': return (a.grade || '').localeCompare(b.grade || '') || a.name.localeCompare(b.name);
            case 'recent': return (b.last_active || '').localeCompare(a.last_active || '');
            case 'oldest': return (a.last_active || '').localeCompare(b.last_active || '');
            case 'study_high': return (b.week_minutes || 0) - (a.week_minutes || 0);
            case 'study_low': return (a.week_minutes || 0) - (b.week_minutes || 0);
            default: return 0;
        }
    });
    }
    renderStudents(filtered);
        }

        /**
         * Fetches student list from the server, populates the grade filter dropdown,
         * and renders cards into #studentContainer.
         */
        function loadStudents() {
            const container = document.getElementById('studentContainer');
            const gradeFilter = document.getElementById('gradeFilter');

            container.innerHTML = '<div class="empty-state"><span style="display:inline-block; animation: spin 1s linear infinite;">&#9696;</span> ' + __('students_loading') + '</div>';
            const grade = gradeFilter ? gradeFilter.value : '';
            const url = '/teacher/students' + (grade ? '?grade=' + encodeURIComponent(grade) : '');

            Promise.all([
                fetch(url, {credentials: 'include'}).then(function(r) { return r.ok ? r.json() : null; }),
                fetch('/grades', {credentials: 'include'}).then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; })
            ]).then(function(results) {
                var data = results[0];
                var gradeList = results[1] || [];
                if (!data) { container.innerHTML = '<div class="empty-state" style="color: var(--danger);">' + __('students_failed_load') + '</div>'; return; }

                var gradeNameMap = {};
                gradeList.forEach(function(g) {
                    var num = (g.name || '').replace(/\D/g, '');
                    if (num) gradeNameMap[num] = g.name;
                });

                const students = data.students || [];
                allStudents = students.map(function(s) {
                    const nameParts = (s.name || '?').split(' ');
                    const initials = nameParts.map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
                    return {
                        id: s.id || s.scholar_id || '',
                        name: s.name || __('students_unknown'),
                        grade: s.grade || '',
                        gradeName: gradeNameMap[s.grade] || (s.grade ? 'Class ' + s.grade : __('students_ungraded')),
                        avatar: initials,
                        last_active: s.last_active || '',
                        week_minutes: (s.study_minutes_this_week || 0),
                        streak: s.streak_days || 0,
                        downloads: s.resources_saved || 0
                    };
                });
                allGrades = [];
                allStudents.forEach(function(s) {
                    if (s.grade && allGrades.indexOf(s.grade) === -1) allGrades.push(s.grade);
                });
                allGrades.sort(function(a, b) { return parseInt(a) - parseInt(b); });
                gradeFilter.innerHTML = '<option value="">' + __('students.all_grades') + '</option>' + allGrades.map(function(g) {
                    var label = gradeNameMap[g] || ('Class ' + g);
                    return '<option value="' + esc(g) + '">' + esc(label) + '</option>';
                }).join('');
                renderStudents(allStudents);
            }).catch(function() {
                container.innerHTML = '<div class="empty-state" style="color: var(--danger);">' + __('students_connection_error') + '</div>';
            });
        }

        /**
         * @param {Array} list - Array of student objects to render as clickable cards
         * Renders student cards into #studentContainer, each linking to student-detail.html
         */
        function renderStudents(list) {
            const container = document.getElementById('studentContainer');
            var atRiskDays = parseInt(document.getElementById('atRiskDays').value, 10) || 3;
            const now = Date.now();
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">' + __('students_none_registered') + '</div>';
                return;
            }
            container.innerHTML = list.map(function(s) {
                const detailUrl = 'student-detail?id=' + encodeURIComponent(s.id) + '&name=' + encodeURIComponent(s.name) + '&grade=' + encodeURIComponent(s.gradeName) + '&avatar=' + encodeURIComponent(s.avatar) + '&last=' + encodeURIComponent(s.last_active || '');
                var daysSinceActive = s.last_active ? (now - new Date(s.last_active).getTime()) / 86400000 : null;
                var atRisk = daysSinceActive !== null && daysSinceActive > atRiskDays;
                var atRiskBadge = atRisk ? '<span class="at-risk-icon" title="Last studied ' + Math.floor(daysSinceActive) + ' days ago"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg></span>' : '';
                var atRiskClass = atRisk ? ' at-risk' : '';
                var totalMins = s.week_minutes || 0;
                var wh;
                if (totalMins >= 60) { var h = Math.floor(totalMins / 60), m = totalMins % 60; wh = h + __('students_hours_abbr') + (m > 0 ? ' ' + m + 'm' : ''); }
                else if (totalMins > 0) { wh = totalMins + 'm'; }
                else { wh = '--'; }
                const st = s.streak || 0;
                const dl = s.downloads || 0;
                return '<div class="card student-card' + atRiskClass + '" data-href="' + detailUrl + '">' +
                    '<div class="student-row">' +
                    '<div class="student-avatar">' + esc(s.avatar) + '</div>' +
                    '<div class="student-body">' +
                    '<div class="student-name-row">' +
                    '<a href="' + detailUrl + '" class="student-name">' + atRiskBadge + esc(s.name) + '</a>' +
                    '<div class="student-stats">' +
                    '<span class="stat-pill"><span class="stat-pill-value">' + wh + '</span></span>' +
                    '<span class="stat-pill"><span class="stat-pill-value">' + st + '<span class="stat-pill-unit">' + __('students_days_abbr') + '</span></span></span>' +
                    '<span class="stat-pill"><span class="stat-pill-value">' + dl + '<span class="stat-pill-unit">' + __('students_saved_abbr') + '</span></span></span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="student-meta">' +
                    esc(s.gradeName) + ' &middot; <span class="scholar-id">' + esc(s.id) + '</span> &middot; ' + __('students_last_updated') + ' ' + timeAgo(s.last_active) +
                    (atRisk ? ' <span class="at-risk-tooltip">(' + Math.floor(daysSinceActive) + 'd)</span>' : '') +
                    '</div>' +
                    '</div>' +
                    '</div></div>';
            }).join('');
        }

        let _debounceTimer;
        function debouncedApplyFilters() {
            clearTimeout(_debounceTimer);
            _debounceTimer = setTimeout(applyFilters, 200);
        }

        var _initStudents = function() {
            loadStudents();
            loadWhoAmI();
            document.getElementById('btn-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('overlay-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('btn-toggleTheme')?.addEventListener('click', toggleTheme);
            document.getElementById('btn-loadStudents')?.addEventListener('click', loadStudents);
            document.getElementById('btn-toggleFilters')?.addEventListener('click', function() {
                document.getElementById('filterPanelBody').classList.toggle('open');
            });
            document.getElementById('studentContainer')?.addEventListener('click', function(e) {
                const card = e.target.closest('.student-card');
                if (card && card.dataset.href) { window.location.href = card.dataset.href; }
            });
            document.getElementById('gradeFilter')?.addEventListener('change', applyFilters);
            document.getElementById('sortSelect')?.addEventListener('change', applyFilters);
            document.getElementById('searchInput')?.addEventListener('input', debouncedApplyFilters);
            document.getElementById('atRiskDays')?.addEventListener('input', applyFilters);
            document.addEventListener('languageChanged', function() { applyFilters(); });
        };
        if (typeof _pageInitRegistry !== 'undefined') _pageInitRegistry['students'] = _initStudents;

        document.addEventListener('DOMContentLoaded', _initStudents);
    </script>
</body>
</html>
