<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Section: Head - theme detection before paint, shared styles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="index.page_title">Lumina Hub | Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/Favicon.svg">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
    <link rel="stylesheet" href="/static/css/lumina.css">

</head>
<body>
    <!-- Section: Sidebar -->
    <aside>

    <!-- Section: Main Content -->
    <main>
        <div id="app-content">
        <!-- Section: Page Header -->
        <div class="page-header">
            <h1 data-i18n="app.title">Lumina Hub</h1>
            <p data-i18n="index_welcome_back">Welcome back. Your local education server is running.</p>
        </div>

        <!-- Section: Stats Grid - 6 dashboard stat cards -->
        <div class="stat-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-icon" style="background:#6366f122;color:#6366f1;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="stat-value" id="statStudents">-</div><div class="stat-label" data-i18n="sidebar.students">Students</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#14b8a622;color:#14b8a6;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div><div class="stat-value" id="statResources">-</div><div class="stat-label" data-i18n="index_stat_resources">Resources</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#f59e0b22;color:#f59e0b;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg></div><div class="stat-value" id="statStorage">-</div><div class="stat-label" data-i18n="index_stat_storage">Storage</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#8b5cf622;color:#8b5cf6;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div><div class="stat-value" id="statSubjects">-</div><div class="stat-label" data-i18n="index_stat_subjects">Subjects</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#14b8a622;color:#14b8a6;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-value" id="statUptime">-</div><div class="stat-label" data-i18n="index_stat_uptime">Uptime</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#10b98122;color:#10b981;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="19" y1="10" x2="21" y2="10"/><line x1="19" y1="14" x2="21" y2="14"/></svg></div><div class="stat-value" id="statBattery">-</div><div class="stat-label" data-i18n="index_stat_battery">Battery</div></div>
        </div>

        <!-- Section: System Info Card -->
        <div class="card">
            <div class="card-title" data-i18n="index_system_info">System Information</div>
            <div class="server-info-grid" id="serverInfoGrid">
                <div class="server-info-row"><span class="server-info-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg><span data-i18n="index_info_server">Server</span></span><span class="server-info-value" data-i18n="index.server_version">Lumina Hub v1.0</span></div>
                <div class="server-info-row"><span class="server-info-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><span data-i18n="index_info_host">Host</span></span><span class="server-info-value" id="infoHost">lumina.hub</span></div>
                <div class="server-info-row"><span class="server-info-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span data-i18n="index_info_uptime">Uptime</span></span><span class="server-info-value" id="infoUptime">-</span></div>
                <div class="server-info-row"><span class="server-info-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg><span data-i18n="index_info_disk">Disk Usage</span></span><span class="server-info-value" id="infoDisk">-</span></div>
            </div>
        </div>
        </div>
    </main>

    <!-- Section: Bottom Navigation (Mobile) -->
    <div id="bottomNav"></div>

    <!-- Section: Scripts - shared JS + dashboard init -->
    <script src="/static/js/lumina.js" defer></script>
    <script>
        const _uptimeEl = document.getElementById('infoUptime');
        const _statUptimeEl = document.getElementById('statUptime');
        let _uptimeSeconds = 0;

        /**
         * Format uptime seconds into a long string (e.g. "3h 12m 5s").
         * @param {number} secs
         * @returns {string}
         */
        function _formatUptime(secs) {
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = secs % 60;
            const hStr = __('index.unit_hours_short');
            const mStr = __('index.unit_minutes_short');
            const sStr = __('index.unit_seconds_short');
            return (h ? h + hStr + ' ' : '') + m + mStr + ' ' + s + sStr;
        }

        /**
         * Format uptime seconds into a short string (e.g. "3h 12m").
         * @param {number} secs
         * @returns {string}
         */
        function _formatUptimeShort(secs) {
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const hStr = __('index.unit_hours_short');
            const mStr = __('index.unit_minutes_short');
            if (h) return h + hStr + ' ' + m + mStr;
            return m + mStr;
        }

        /**
         * Load dashboard stats from /stats endpoint.
         * Populates the 6 stat cards and system info grid.
         */
        async function loadStats() {
            try {
                const res = await fetch('/stats');
                if (res.ok) {
                    const d = await res.json();
                    document.getElementById('statStudents').textContent = d.scholars ?? d.students ?? '-';
                    document.getElementById('statResources').textContent = d.resources ?? '-';
                    document.getElementById('statStorage').textContent = d.storage ?? (d.disk_used ? d.disk_used + __('index.unit_gb') : '-');
                    document.getElementById('statSubjects').textContent = d.subjects ?? '-';
                    if (d.uptime) {
                        const parts = d.uptime.match(/(\d+)h\s*(\d+)m\s*(\d+)s|(\d+)h\s*(\d+)m|(\d+)m\s*(\d+)s|(\d+)s/);
                        if (parts) {
                            if (parts[1]) _uptimeSeconds = parseInt(parts[1]) * 3600 + parseInt(parts[2]) * 60 + (parseInt(parts[3]) || 0);
                            else if (parts[4]) _uptimeSeconds = parseInt(parts[4]) * 3600 + parseInt(parts[5]) * 60;
                            else if (parts[6]) _uptimeSeconds = parseInt(parts[6]) * 60 + (parseInt(parts[7]) || 0);
                            else if (parts[8]) _uptimeSeconds = parseInt(parts[8]);
                        }
                        _uptimeEl.textContent = _formatUptime(_uptimeSeconds);
                        _statUptimeEl.textContent = _formatUptimeShort(_uptimeSeconds);
                    }
                    if (d.battery_percent !== undefined) {
                        document.getElementById('statBattery').textContent = d.battery_percent + __('index.unit_percent');
                    }
                    if (d.disk_usage) document.getElementById('infoDisk').textContent = d.disk_usage;
                }
            } catch (e) { console.error('Stats load error', e); }
        }

        // Tick uptime every second (guard against re-registration on SPA nav)
        if (!window._uptimeInterval) {
            window._uptimeInterval = setInterval(function() {
                if (_uptimeSeconds > 0) {
                    _uptimeSeconds++;
                    _uptimeEl.textContent = _formatUptime(_uptimeSeconds);
                    _statUptimeEl.textContent = _formatUptimeShort(_uptimeSeconds);
                }
            }, 1000);
        }

        _pageInitRegistry['home'] = function() {
            loadWhoAmI();
            loadStats();

            document.getElementById('btn-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('overlay-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('btn-toggleTheme')?.addEventListener('click', toggleTheme);
        };

        document.addEventListener('DOMContentLoaded', _pageInitRegistry['home']);
    </script>
</body>
</html>
