<!DOCTYPE html>
<html lang="en">
<!-- Section: Head — theme detection, metadata, detail page styles -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Detail - Lumina Hub</title>
    <!-- Theme detection: prevent flash of wrong theme by applying stored/device preference before render -->
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
<link rel="stylesheet" href="/static/css/lumina.css">
    <style>
        /* === Layout and component styles for student detail page === */
        body { justify-content: center; }
        main { margin-left: 0; width: 100%; max-width: none; padding: 2.5rem 1rem; display: flex; justify-content: center; }
        .student-detail-container { width: 100%; max-width: 900px; }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--teal); text-decoration: none; font-weight: 700; margin-bottom: 1.5rem; transition: opacity var(--transition); }
        .back-link:hover { opacity: 0.75; }
        .student-header { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem; }
        .avatar-large { width: 64px; height: 64px; border-radius: 50%; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 800; flex-shrink: 0; }
        .student-info h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -0.025em; margin-bottom: 0.15rem; }
        .student-info .meta { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.875rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--bg-surface); border: 1px solid var(--outline); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--card-shadow); text-align: center; transition: box-shadow var(--transition), transform var(--transition); }
        .stat-card:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
        .stat-card .stat-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.25rem; }
        .stat-card .stat-value { font-size: 1.125rem; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; white-space: nowrap; }
        .stat-card .stat-unit { font-size: 0.75rem; font-weight: 400; color: var(--text-muted); margin-left: 0.2rem; }
        .subject-list { display: flex; flex-direction: column; gap: 0.875rem; }
        .subject-row { display: flex; align-items: center; gap: 0.75rem; }
        .subject-name { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); min-width: 90px; }
        .subject-bar-wrap { flex: 1; display: flex; align-items: center; gap: 0.75rem; }
        .subject-bar-track { flex: 1; height: 8px; background: var(--outline); border-radius: 100px; overflow: hidden; }
        .subject-bar-fill { height: 100%; border-radius: 100px; transition: width 0.6s ease; }
        .subject-minutes { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; min-width: 3.5rem; text-align: right; }
        .activity-list { display: flex; flex-direction: column; }
        .activity-item { display: flex; align-items: flex-start; gap: 0.875rem; padding: 0.875rem 0; border-bottom: 1px solid var(--outline); }
        .activity-item:last-child { border-bottom: none; }
        .activity-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .activity-body { flex: 1; min-width: 0; }
        .activity-body .activity-action { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
        .activity-body .activity-detail { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.1rem; }
        .activity-body .activity-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.15rem; }
        .show-more-wrap { text-align: center; padding-top: 1rem; }
        @media (max-width: 768px) {
            main { padding: 1.5rem 1rem; }
            .student-header { gap: 1rem; }
            .avatar-large { width: 48px; height: 48px; font-size: 1rem; }
            .student-info h1 { font-size: 1.25rem; }
            .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 0.625rem; }
            .stat-card { padding: 1rem; }
            .stat-card .stat-value { font-size: 1rem; }
            .subject-name { min-width: 70px; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            main { padding: 1rem 0.75rem; }
            .stat-grid { grid-template-columns: 1fr; }
            .subject-name { min-width: 60px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <!-- Section: Main Content — back link, student header, stat cards, subject breakdown, loading/error states -->
    <main>
        <div class="student-detail-container" id="app">
            <a href="/static/students" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                Back to Students
            </a>
            <!-- Section: Student Header — avatar, name, grade, last active -->
            <div class="student-header" id="studentHeader"></div>
            <!-- Section: Stat Cards — time this week, streak, downloads -->
            <div class="stat-grid" id="statGrid"></div>
            <!-- Section: Subject Breakdown — horizontal bar chart per subject -->
            <div class="card" id="subjectCard">
                <div class="card-title" id="subjectCardTitle">Subject Breakdown</div>
                <div class="subject-list" id="subjectList"></div>
            </div>
            <!-- Section: Loading / Error States -->
            <div id="loadingState" class="empty-state" style="display:none;">Loading student data...</div>
            <div id="errorState" class="empty-state" style="display:none; color: var(--danger);">Failed to load student data.</div>
        </div>
    </main>
    <script src="/static/js/lumina.js"></script>
    <!-- Section: Inline Scripts — student analytics rendering, demo data fallback, API fetching -->
    <script>
        var params = new URLSearchParams(window.location.search);
        var studentId = params.get('id') || '';
        var studentName = params.get('name') || 'Student';
        var studentGrade = params.get('grade') || '';
        var weekMinutes = parseInt(params.get('week')) || 0;
        var streakDays = parseInt(params.get('streak')) || 0;
        var dlCount = parseInt(params.get('dl')) || 0;
        var lastActive = params.get('last') || '';
        var avatarInitials = params.get('avatar') || studentName.split(' ').map(function(s){return s[0]}).join('').slice(0,2).toUpperCase();

        var subjectColors = ['#14b8a6','#6366f1','#f59e0b','#ef4444','#8b5cf6','#ec4899','#10b981','#f97316'];

        /* Section: Demo student analytics data — used when IS_DEMO is true */
        var demoStudents = {
            'demo-1': {
                last_active: new Date(Date.now()-1800000).toISOString(),
                week_minutes: 320,
                streak: 12,
                downloads: 18,
                subjects:[{name:'Math',minutes:95},{name:'Science',minutes:82},{name:'English',minutes:78},{name:'History',minutes:65}]
            },
            'demo-2': {
                last_active: new Date(Date.now()-7200000).toISOString(),
                week_minutes: 195,
                streak: 3,
                downloads: 7,
                subjects:[{name:'Math',minutes:60},{name:'Science',minutes:80},{name:'English',minutes:55}]
            },
            'demo-3': {
                last_active: new Date(Date.now()-300000).toISOString(),
                week_minutes: 425,
                streak: 18,
                downloads: 24,
                subjects:[{name:'Math',minutes:110},{name:'Science',minutes:98},{name:'English',minutes:92},{name:'History',minutes:75},{name:'Geography',minutes:50}]
            },
            'demo-4': {
                last_active: new Date(Date.now()-3600000).toISOString(),
                week_minutes: 160,
                streak: 5,
                downloads: 4,
                subjects:[{name:'Math',minutes:45},{name:'Science',minutes:55},{name:'English',minutes:60}]
            },
            'demo-5': {
                last_active: new Date(Date.now()-600000).toISOString(),
                week_minutes: 300,
                streak: 10,
                downloads: 15,
                subjects:[{name:'Math',minutes:88},{name:'Science',minutes:80},{name:'English',minutes:72},{name:'History',minutes:60}]
            },
            'demo-6': {
                last_active: new Date(Date.now()-10800000).toISOString(),
                week_minutes: 228,
                streak: 7,
                downloads: 9,
                subjects:[{name:'Math',minutes:82},{name:'Physics',minutes:76},{name:'English',minutes:70}]
            },
            'demo-7': {
                last_active: new Date(Date.now()-900000).toISOString(),
                week_minutes: 330,
                streak: 14,
                downloads: 20,
                subjects:[{name:'Math',minutes:98},{name:'Science',minutes:84},{name:'English',minutes:86},{name:'Geography',minutes:62}]
            },
            'demo-8': {
                last_active: new Date(Date.now()-86400000).toISOString(),
                week_minutes: 90,
                streak: 1,
                downloads: 2,
                subjects:[{name:'Science',minutes:40},{name:'English',minutes:50}]
            },
            'demo-9': {
                last_active: new Date(Date.now()-2700000).toISOString(),
                week_minutes: 517,
                streak: 25,
                downloads: 32,
                subjects:[{name:'Math',minutes:115},{name:'Science',minutes:105},{name:'English',minutes:98},{name:'History',minutes:85},{name:'Geography',minutes:72},{name:'Sanskrit',minutes:42}]
            },
            'demo-10': {
                last_active: new Date(Date.now()-7200000).toISOString(),
                week_minutes: 205,
                streak: 4,
                downloads: 6,
                subjects:[{name:'Math',minutes:68},{name:'Science',minutes:72},{name:'English',minutes:65}]
            }
        };

        /**
         * @param {string} isoStr - ISO date string
         * @returns {string} Human-friendly relative time label
         */
        function timeAgo(isoStr) {
            var now = new Date();
            var d = new Date(isoStr);
            var diff = Math.floor((now - d) / 1000);
            if (diff < 60) return diff <= 5 ? 'Just now' : diff + 's ago';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            var days = Math.floor(diff / 86400);
            if (days === 1) return 'Yesterday';
            if (days < 30) return days + 'd ago';
            return d.toLocaleDateString();
        }

        /** Renders the student avatar, name, grade, and last active into #studentHeader. */
        function renderHeader() {
            var el = document.getElementById('studentHeader');
            el.innerHTML =
                '<div class="avatar-large">' + esc(avatarInitials) + '</div>' +
                '<div class="student-info">' +
                '<h1>' + esc(studentName) + '</h1>' +
                '<div class="meta">' +
                '<span>' + esc(studentGrade) + '</span>' +
                (lastActive ? '<span class="meta-dot"></span><span>Last updated ' + esc(timeAgo(lastActive)) + '</span>' : '') +
                '</div></div>';
        }

        /**
         * @param {number} weekMin - Total study minutes this week
         * @param {number} streakVal - Consecutive day streak
         * @param {number} dlVal - Number of downloads
         * Renders three stat cards into #statGrid.
         */
        function renderStats(weekMin, streakVal, dlVal) {
            var weekVal = (weekMin / 60).toFixed(1).replace(/\.0$/, '');
            var grid = document.getElementById('statGrid');
            var cards = [
                { label:'Time This Week', value:weekVal, unit:'h' },
                { label:'Day Streak', value:streakVal, unit:'days' },
                { label:'Downloaded', value:dlVal, unit:'' }
            ];
            grid.innerHTML = cards.map(function(c){
                var val = c.label === 'Day Streak' ? c.value : c.value + (c.unit ? ' <span class="stat-unit">' + c.unit + '</span>' : '');
                return '<div class="stat-card">' +
                    '<div class="stat-label">' + c.label + '</div>' +
                    '<div class="stat-value">' + val + '</div></div>';
            }).join('');
        }

        /**
         * @param {Array} subjects - Array of {name, minutes} objects
         * Renders subject breakdown into #subjectList with proportional bar fills.
         */
        function renderSubjects(subjects) {
            /* Set the card title with the student's grade */
            var titleEl = document.getElementById('subjectCardTitle');
            if (studentGrade) {
                titleEl.innerHTML = esc(studentGrade) + ' &mdash; Subject Breakdown <span style="font-weight:400;font-size:0.75rem;color:var(--text-muted);">(This Week)</span>';
            } else {
                titleEl.innerHTML = 'Subject Breakdown <span style="font-weight:400;font-size:0.75rem;color:var(--text-muted);">(This Week)</span>';
            }
            if (!subjects || subjects.length === 0) {
                document.getElementById('subjectList').innerHTML = '<div class="empty-state">No subject data available.</div>';
                return;
            }
            var maxMin = Math.max.apply(null, subjects.map(function(s){ return s.minutes; }));
            var list = document.getElementById('subjectList');
            list.innerHTML = subjects.map(function(s, i){
                var pct = (s.minutes / maxMin) * 100;
                var color = subjectColors[i % subjectColors.length];
                return '<div class="subject-row">' +
                    '<span class="subject-name">' + esc(s.name) + '</span>' +
                    '<div class="subject-bar-wrap">' +
                    '<div class="subject-bar-track"><div class="subject-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
                    '<span class="subject-minutes">' + s.minutes + 'm</span>' +
                    '</div></div>';
            }).join('');
        }

        /** Entry point — reads URL params, renders header/stats/subjects from demo data or API. */
        function init() {
            if (!studentId) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = '';
                document.getElementById('errorState').textContent = 'No student ID provided.';
                return;
            }
            if (IS_DEMO && !lastActive) {
                var demoLookup = demoStudents[studentId];
                if (demoLookup && demoLookup.last_active) lastActive = demoLookup.last_active;
            }
            renderHeader();
            if (IS_DEMO) {
                var demo = demoStudents[studentId];
                if (!demo) {
                    document.getElementById('statGrid').innerHTML = '';
                    document.getElementById('subjectList').innerHTML = '<div class="empty-state">Demo data not available for this student.</div>';
                    document.getElementById('loadingState').style.display = 'none';
                    return;
                }
                renderStats(demo.week_minutes, demo.streak, demo.downloads);
                renderSubjects(demo.subjects);
                document.getElementById('loadingState').style.display = 'none';
            } else {
                /* Auth flow: uses apiFetch with cookie-based session to call /teacher/student/{id}/analytics */
                apiFetch('/teacher/student/' + encodeURIComponent(studentId) + '/analytics').then(function(r){ return r.json(); })
                .then(function(analytics){
                    renderStats((analytics.study_minutes_this_week || 0) * 60, analytics.streak_days || 0, analytics.resources_saved || 0);
                    renderSubjects(analytics.subjects || []);
                    document.getElementById('loadingState').style.display = 'none';
                }).catch(function(err){
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('errorState').style.display = '';
                    console.error('Failed to load student data', err);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            init();
        });
    </script>
</body>
</html>
