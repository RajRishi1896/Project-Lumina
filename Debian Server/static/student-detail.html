<!DOCTYPE html>
<html lang="en">
<!-- Section: Head � theme detection, metadata, detail page styles -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="student_detail.page_title">Student Detail - Lumina Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/Favicon.svg">
    <!-- Theme detection: prevent flash of wrong theme by applying stored/device preference before render -->
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('lumina-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))</script>
<link rel="stylesheet" href="/static/css/lumina.css">
</head>
<body>
    <a href="#app-content" class="skip-link" data-i18n="skip_to_content">Skip to main content</a>
    <!-- Section: Sidebar � empty, rendered by renderLayout() -->
    <aside></aside>

    <!-- Section: Main Content � back link, student header, stat cards, subject breakdown, loading/error states -->
    <main>
        <div id="app-content">
        <div class="student-detail-container" id="app">
            <a href="/static/students" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                <span data-i18n="student_detail_back">Back to</span> <span data-i18n="sidebar.students">Students</span>
            </a>
            <!-- Section: Student Header � avatar, name, grade, last active -->
            <div class="student-header" id="studentHeader"></div>
            <!-- Section: Stat Cards � time this week, streak, downloads -->
            <div class="stat-grid" id="statGrid"></div>
            <!-- Section: Subject Breakdown � horizontal bar chart per subject -->
            <div class="card" id="subjectCard">
                <div class="card-title" id="subjectCardTitle">Subject Breakdown</div>
                <div class="subject-list" id="subjectList"></div>
            </div>
            <!-- Section: Loading / Error States -->
            <div id="loadingState" class="empty-state" style="display:none;" data-i18n="student_detail_loading">Loading student data...</div>
            <div id="errorState" class="empty-state" style="display:none; color: var(--danger);" data-i18n="student_detail_failed">Failed to load student data.</div>
        </div>
        </div>
    </main>

    <!-- Section: Bottom Nav (Mobile) � tab bar hidden by default, shown via media query -->
    <div id="bottomNav"></div>

    <script src="/static/js/lumina.js?v=9" defer></script>
    <!-- Section: Inline Scripts � student analytics rendering, API fetching -->
    <script>
        var subjectColors = ['#14b8a6','#6366f1','#f59e0b','#ef4444','#8b5cf6','#ec4899','#10b981','#f97316'];

        var _initStudentDetail = function() {
            const params = new URLSearchParams(window.location.search);
            const studentId = params.get('id') || '';
            const studentName = params.get('name') || 'Student';
            const studentGrade = params.get('grade') || '';
            const weekMinutes = parseInt(params.get('week')) || 0;
            const streakDays = parseInt(params.get('streak')) || 0;
            const dlCount = parseInt(params.get('dl')) || 0;
            const lastActive = params.get('last') || '';
            const avatarInitials = params.get('avatar') || studentName.split(' ').map(function(s){return s[0]}).join('').slice(0,2).toUpperCase();



            /** Renders the student header with avatar, name, grade, last active, and at-risk warning. */
            function renderHeader() {
                const el = document.getElementById('studentHeader');
                var atRiskDays = 3;
                var daysSinceActive = lastActive ? (Date.now() - new Date(lastActive).getTime()) / 86400000 : null;
                var atRisk = daysSinceActive !== null && daysSinceActive > atRiskDays;
                var warningBanner = atRisk ? '<div style="background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.625rem; font-size: 0.85rem;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg> <span style="font-weight: 700; color: var(--warning);">At-risk</span> &mdash; No activity in ' + Math.floor(daysSinceActive) + ' days.</div>' : '';
                el.innerHTML = warningBanner +
                    '<div class="avatar-large">' + esc(avatarInitials) + '</div>' +
                    '<div class="student-info">' +
                    '<h1>' + esc(studentName) + '</h1>' +
                    '<div class="meta">' +
                    '<span>' + esc(studentGrade) + '</span>' +
                    (lastActive ? '<span class="meta-dot"></span><span>' + __('student_detail_last_updated') + ' ' + esc(timeAgo(lastActive)) + '</span>' : '') +
                    '</div></div>';
            }

            /**
             * Renders the stat cards grid (time this week, day streak, downloads).
             * @param {number} weekMin - Minutes studied this week.
             * @param {number} streakVal - Consecutive days of activity.
             * @param {number} dlVal - Number of downloaded resources.
             */
            function renderStats(weekMin, streakVal, dlVal) {
                var weekStr;
                if (weekMin >= 60) { var h = Math.floor(weekMin / 60), m = weekMin % 60; weekStr = h + ' ' + __('students_hours_abbr') + (m > 0 ? ' ' + m + __('students_minutes_abbr') : ''); }
                else if (weekMin > 0) { weekStr = weekMin + __('students_minutes_abbr'); }
                else { weekStr = '0' + __('students_minutes_abbr'); }
                const grid = document.getElementById('statGrid');
                const cards = [
                    { label:__('student_detail_time_this_week'), value:weekStr },
                    { label:__('student_detail_day_streak'), value:streakVal },
                    { label:__('student_detail_downloaded'), value:dlVal }
                ];
                grid.innerHTML = cards.map(function(c){
                    return '<div class="stat-card">' +
                        '<div class="stat-label">' + c.label + '</div>' +
                        '<div class="stat-value">' + c.value + '</div></div>';
                }).join('');
            }

            /**
             * Renders per-subject study time as a horizontal bar chart.
             * @param {Array<{name: string, minutes: number}>} subjects - Subject breakdown data.
             */
            function renderSubjects(subjects) {
                const titleEl = document.getElementById('subjectCardTitle');
                if (studentGrade) {
                    titleEl.innerHTML = esc(studentGrade) + ' &mdash; ' + __('student_detail_subject_breakdown') + ' <span style="font-weight:400;font-size:0.75rem;color:var(--text-muted);">' + __('student_detail_this_week') + '</span>';
                } else {
                    titleEl.innerHTML = __('student_detail_subject_breakdown') + ' <span style="font-weight:400;font-size:0.75rem;color:var(--text-muted);">' + __('student_detail_this_week') + '</span>';
                }
                if (!subjects || subjects.length === 0) {
                    document.getElementById('subjectList').innerHTML = '<div class="empty-state">' + __('student_detail_no_subject_data') + '</div>';
                    return;
                }
                const maxMin = Math.max.apply(null, subjects.map(function(s){ return s.minutes; }));
                const list = document.getElementById('subjectList');
                list.innerHTML = subjects.map(function(s, i){
                    const pct = (s.minutes / maxMin) * 100;
                    const color = subjectColors[i % subjectColors.length];
                    return '<div class="subject-row">' +
                        '<span class="subject-name">' + esc(s.name) + '</span>' +
                        '<div class="subject-bar-wrap">' +
                        '<div class="subject-bar-track"><div class="subject-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
                        '<span class="subject-minutes">' + s.minutes + __('students_minutes_abbr') + '</span>' +
                        '</div></div>';
                }).join('');
            }

            /** Entry point: parses URL params, renders header, fetches analytics, and populates the page. */
            function init() {
                if (!studentId) {
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('errorState').style.display = '';
                    document.getElementById('errorState').textContent = __('student_detail_no_id');
                    return;
                }
                renderHeader();
                document.getElementById('loadingState').style.display = '';
                fetch('/teacher/student/' + encodeURIComponent(studentId) + '/analytics', {credentials: 'include'})
                .then(function(r){
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(analytics){
                    renderStats((analytics.study_minutes_this_week || 0), analytics.streak_days || 0, analytics.resources_saved || 0);
                    renderSubjects(analytics.subjects || []);
                    document.getElementById('loadingState').style.display = 'none';
                }).catch(function(err){
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('errorState').style.display = '';
                    console.error('Failed to load student data', err);
                });
            }

            init();

            document.getElementById('btn-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('overlay-toggleMobileMenu')?.addEventListener('click', toggleMobileMenu);
            document.getElementById('btn-toggleTheme')?.addEventListener('click', toggleTheme);
        };
        if (typeof _pageInitRegistry !== 'undefined') _pageInitRegistry['student-detail'] = _initStudentDetail;

        document.addEventListener('DOMContentLoaded', _initStudentDetail);
    </script>
</body>
</html>
